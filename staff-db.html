<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — терминал SQL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>ТЕРМИНАЛ SQL — БАЗА СТАНЦИИ</h1>
  <div class="panel">
    <p class="muted">Структура базы не публикуется. Разрешены только запросы SELECT.</p>
  </div>
  <div class="panel">
    <textarea id="sql" rows="4" spellcheck="false" placeholder="SELECT ..."></textarea>
    <p><button id="run" type="button">Выполнить</button>
      <span class="muted">или Ctrl+Enter</span></p>
    <div id="out"></div>
  </div>
  <div class="panel" id="done" style="display:none"></div>
</div>

<script src="https://sql.js.org/dist/sql-wasm.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script src="js/sqlterm.js"></script>
<script>
requireDone('q0', 'index.html');

document.addEventListener('DOMContentLoaded', function () {
  initSqlTerminal({
    inputId: 'sql',
    runId: 'run',
    outputId: 'out',
    allowedTables: ['employees', 'notes'],
    onResult(columns, values) {
      const done = document.getElementById('done');
      const idIndex = columns.indexOf('id');
      const noteIndex = columns.indexOf('note');
      if (idIndex < 0) return;

      if (noteIndex >= 0) {
        const row = values.find(r => Number(r[idIndex]) === CONFIG.target.id);
        if (!row) return;
        done.style.display = '';
        done.innerHTML = `<p>Заметка сотрудника ${String(CONFIG.target.id).padStart(3, '0')} хранится в закодированном виде.</p>
          <p><a class="btn" href="terminal.html?target=notes&value=${encodeURIComponent(row[noteIndex])}">Открыть Python-терминал</a></p>`;
        return;
      }

      if (values.length === 1 && Number(values[0][idIndex]) === CONFIG.target.id) {
        markDone('q1');
        done.style.display = '';
        done.innerHTML = '<p class="status-ok">Запись найдена. Данные сотрудника зафиксированы в деле операции.</p>'
          + '<a class="btn" href="dashboard.html">Вернуться в личный кабинет</a>';
      }
    }
  });
});
</script>
</body>
</html>
