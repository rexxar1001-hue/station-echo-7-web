<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — радиоархив AP-07</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  #spectrogram { max-width: 100%; border: 1px solid var(--border); display: none; margin-top: 12px; }
  .file-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .file-list button.active { border-color: var(--accent); color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  .opt-group { border: 1px solid var(--border); padding: 6px 14px 10px; margin: 0; min-width: 190px; }
  .opt-group legend { color: var(--fg-dim); font-size: 12px; padding: 0 6px; }
  .opt-group label { display: block; margin-top: 6px; cursor: pointer; }
  .opt-group input { accent-color: var(--accent); margin-right: 6px; }
  .opt-group:disabled label { opacity: 0.45; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">АРХИВЫ — РАДИОЗАПИСИ</h1>
  <div class="panel">
    <p>Точки приёма:</p>
    <div class="file-list" id="points"></div>
  </div>
  <div class="panel">
    <p id="files-hint" class="muted">Выберите точку приёма.</p>
    <div id="files-box" style="display:none">
      <p>Записи повреждены. Подписи о назначении частот утрачены.</p>
      <div class="file-list" id="files"></div>
    </div>
  </div>
  <div class="panel">
    <p id="current" class="muted">Файл не выбран.</p>
    <div class="opts">
      <fieldset class="opt-group" id="grp-dir" disabled>
        <legend>Направление</legend>
        <label><input type="radio" name="dir" value="normal" checked>Normal</label>
        <label><input type="radio" name="dir" value="reverse">Reverse</label>
      </fieldset>
      <fieldset class="opt-group" id="grp-speed" disabled>
        <legend>Скорость</legend>
        <label><input type="radio" name="speed" value="0.5">Slow x0.5</label>
        <label><input type="radio" name="speed" value="0.75">Slow x0.75</label>
        <label><input type="radio" name="speed" value="1" checked>x1</label>
        <label><input type="radio" name="speed" value="1.25">Fast x1.25</label>
        <label><input type="radio" name="speed" value="2">Fast x2</label>
      </fieldset>
    </div>
    <p>
      <button id="play" type="button" disabled>&#9654; Воспроизвести</button>
      <button id="spec" type="button" disabled>Spectrogram</button>
    </p>
    <p class="muted" id="status"></p>
    <img id="spectrogram" alt="спектрограмма">
  </div>
  <div class="panel" id="done" style="display:none">
    <p class="status-ok">Метка со спектрограммы зафиксирована в деле операции.</p>
    <a class="btn" href="dashboard.html">Личный кабинет</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q3');

let ctx = null;
let buffer = null;
let currentFile = null;
let currentPoint = null;
let usedReverse = false;
let usedSpectrogram = false;
let currentAudio = null;   // сейчас играющий <audio>
let rawData = null;        // исходные байты записи
let rawType = 'audio/wav';
const urlCache = {};       // blob-адреса: обычный и обращённый вариант

function setControlsEnabled(on) {
  document.getElementById('grp-dir').disabled = !on;
  document.getElementById('grp-speed').disabled = !on;
  document.getElementById('play').disabled = !on;
  document.getElementById('spec').disabled = !on;
}

function stopPlayback() {
  if (currentAudio) {
    try { currentAudio.pause(); } catch (e) { /* уже остановлен */ }
    currentAudio = null;
  }
}

function resetUrls() {
  Object.values(urlCache).forEach(u => URL.revokeObjectURL(u));
  for (const k in urlCache) delete urlCache[k];
}

// WAV из AudioBuffer (для обратного воспроизведения): 16 бит, без потерь.
function bufferToWav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, t) => { for (let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true);
  out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, len * ch * 2, true);
  const data = []; for (let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const v = Math.max(-1, Math.min(1, data[c][i]));
    out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2;
  }
  return new Blob([out], { type: 'audio/wav' });
}

async function loadFile(name) {
  stopPlayback();
  currentFile = name;
  resetUrls(); rawData = null;
  usedReverse = false;
  usedSpectrogram = false;
  document.getElementById('spectrogram').style.display = 'none';
  document.getElementById('current').textContent = 'Выбран файл: ' + name;
  document.getElementById('status').textContent = 'Загрузка…';
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  try {
    // Сначала настоящая запись из records/ (AP01-rec_47_2.mp3); если её нет — заглушка из audio/.
    const recName = currentPoint.replace('-', '') + '-' + name.replace(/\.(wav|mp3)$/, '').replace(/\./g, '_') + '.mp3';
    let res = null;
    try { res = await fetch(CONFIG.recordsRoot + recName); } catch (e) { res = null; }
    if (!res || !res.ok) res = await fetch(CONFIG.audioRoot + currentPoint + '/' + name);
    const data = await res.arrayBuffer();
    rawData = data.slice(0);
    rawType = res.url.endsWith('.mp3') ? 'audio/mpeg' : 'audio/wav';
    buffer = await ctx.decodeAudioData(data);
    document.getElementById('status').textContent = 'Запись загружена.';
  } catch (e) {
    buffer = null;
    document.getElementById('status').innerHTML =
      '<span class="status-bad">Запись не читается (файл-заглушка ещё не заменён).</span>';
  }
  setControlsEnabled(true);
}

// Скорость меняется без смены тона (preservesPitch): голос остаётся прежним, как при растяжении времени.
function play(rate, reversed) {
  if (!buffer || !rawData) return;
  const key = reversed ? 'rev' : 'fwd';
  if (!urlCache[key]) {
    const blob = reversed
      ? (() => {
          const rb = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
          for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
            rb.copyToChannel(buffer.getChannelData(ch).slice().reverse(), ch);
          }
          return bufferToWav(rb);
        })()
      : new Blob([rawData], { type: rawType });
    urlCache[key] = URL.createObjectURL(blob);
  }
  stopPlayback();
  const a = new Audio(urlCache[key]);
  a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
  a.playbackRate = rate;
  a.addEventListener('ended', () => { if (currentAudio === a) currentAudio = null; });
  currentAudio = a;
  const started = a.play();
  if (started && started.catch) started.catch(() => {});
}

function checkProgress() {
  if (currentPoint === CONFIG.correctPoint && currentFile === CONFIG.correctAudio && usedReverse && usedSpectrogram) {
    markDone('q4');
    setData('callsign', CONFIG.callsign);
    document.getElementById('done').style.display = '';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  function selectPoint(code) {
    currentPoint = code;
    stopPlayback();
    currentFile = null; buffer = null; rawData = null; resetUrls(); usedReverse = false; usedSpectrogram = false;
    document.querySelectorAll('#points button').forEach(b => b.classList.toggle('active', b.dataset.point === code));
    document.querySelectorAll('#files button').forEach(b => b.classList.remove('active'));
    setControlsEnabled(false);
    document.getElementById('spectrogram').style.display = 'none';
    document.getElementById('current').textContent = 'Файл не выбран.';
    document.getElementById('status').textContent = '';
    document.getElementById('title').textContent = 'АРХИВЫ — РАДИОЗАПИСИ, ТОЧКА ' + code;
    document.getElementById('files-hint').style.display = 'none';
    document.getElementById('files-box').style.display = '';
  }

  document.getElementById('points').innerHTML = CONFIG.mapPoints
    .map(p => `<button type="button" data-point="${p.code}">${p.code}</button>`).join('');
  document.getElementById('points').addEventListener('click', e => {
    const btn = e.target.closest('button[data-point]');
    if (btn) selectPoint(btn.dataset.point);
  });
  const fromUrl = new URLSearchParams(location.search).get('point');
  if (fromUrl && CONFIG.mapPoints.some(p => p.code === fromUrl)) selectPoint(fromUrl);

  document.getElementById('files').innerHTML = CONFIG.audioFiles
    .map(f => `<button type="button" data-file="${f}">${f}</button>`).join('');

  document.getElementById('files').addEventListener('click', e => {
    const btn = e.target.closest('button[data-file]');
    if (!btn) return;
    document.querySelectorAll('#files button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadFile(btn.dataset.file);
  });

  // Фильтры только выбираются (радиокнопки); запись играет по кнопке «Воспроизвести».
  document.getElementById('play').addEventListener('click', () => {
    const reversed = document.querySelector('input[name="dir"]:checked').value === 'reverse';
    const rate = Number(document.querySelector('input[name="speed"]:checked').value);
    if (reversed) usedReverse = true;
    play(rate, reversed);
    checkProgress();
  });
  document.getElementById('spec').addEventListener('click', () => {
    usedSpectrogram = true;
    const img = document.getElementById('spectrogram');
    const name = currentFile.replace(/\.wav$/, '');
    img.onerror = () => { img.onerror = null; img.src = 'img/spectrogram_noise.png'; };
    // Метка SHADOW-01 есть только на записи верной точки; у «одноимённых» файлов других точек — обычный шум.
    img.src = (currentPoint !== CONFIG.correctPoint && currentFile === CONFIG.correctAudio)
      ? 'img/spectrogram_noise.png' : `img/spectrogram_${name}.png`;
    img.style.display = 'block';
    checkProgress();
  });
});
</script>
</body>
</html>
