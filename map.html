<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  #map { height: 70vh; min-height: 420px; background: #04080a; border: 1px solid var(--border); }
  .leaflet-container { background: #04080a; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0b1416; color: #cfe6e2; border: 1px solid var(--border); }
  .leaflet-popup-content a { color: #63d7ff; }
  .ap-popup { font: 13px/1.4 inherit; }
  .ap-popup b { letter-spacing: .05em; }
  .ap-popup img { display: block; width: 220px; margin: 6px 0 2px; border: 1px solid #2a3b40; }
  .ap-popup .file { font-size: 11px; opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>КАРТА СТАНЦИИ</h1>
  <div class="panel">
    <p>Архивные точки острова. Перемещение — перетаскиванием, масштаб — колесом мыши.</p>
    <p>
      <input type="text" id="coords" placeholder="Перейти к координатам, например 45.8923, 13.0642" style="max-width:420px;display:inline-block;width:auto">
      <button id="go" type="button">Перейти</button>
    </p>
    <p class="muted" id="msg"></p>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q2');

const IMG_W = 1500, IMG_H = 1000;

// Перевод игровых координат в координаты карты (линейная привязка к кластеру)
function gameToMap(lat, lng) {
  const anchor = CONFIG.mapPoints.find(p => p.code === CONFIG.correctPoint);
  const y = anchor.y + (lat - CONFIG.coords.lat) * 10000;
  const x = anchor.x + (lng - CONFIG.coords.lng) * 10000;
  return [y, x];
}

document.addEventListener('DOMContentLoaded', function () {
  const map = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 4, zoomControl: true });
  const bounds = [[0, 0], [IMG_H, IMG_W]];
  L.imageOverlay('img/island.jpg', bounds).addTo(map);
  map.fitBounds(bounds);

  CONFIG.mapPoints.forEach(pt => {
    L.circleMarker([pt.y, pt.x], { radius: 6, color: '#63d7ff', fillColor: '#63d7ff', fillOpacity: .6 })
      .addTo(map)
      .bindTooltip(pt.code, { permanent: false })
      .bindPopup(popupHtml(pt), { maxWidth: 260 })
      .on('click', () => openArchive(pt.code));
  });

  function popupHtml(pt) {
    const shots = (CONFIG.mapPhotos && pt.photos || []).map(id => {
      const file = `field_photo_${id}.jpg`;
      return `<a href="exif-tool.html?file=${file}"><img src="img/${file}" alt="${file}" loading="lazy">
        <span class="file">${file}</span></a>`;
    }).join('');
    return `<div class="ap-popup"><b>${pt.code}</b><br>${pt.place || ''}${shots}</div>`;
  }

  function openArchive(code) {
    const msg = document.getElementById('msg');
    if (code === CONFIG.correctPoint) {
      markDone('q3');
      msg.innerHTML = `<span class="status-ok">Точка ${code}: архив доступен.</span>
        <a class="btn" href="radio-archive.html">Открыть архив точки ${code}</a>`;
    } else {
      msg.innerHTML = `<span class="muted">Точка ${code}: архив недоступен.</span>`;
    }
  }

  document.getElementById('go').addEventListener('click', function () {
    const raw = document.getElementById('coords').value.replace(/[^\d.,\-\s]/g, '');
    const parts = raw.split(/[,\s]+/).filter(Boolean).map(Number);
    if (parts.length < 2 || parts.some(isNaN)) {
      document.getElementById('msg').textContent = 'Координаты не распознаны.';
      return;
    }
    document.getElementById('msg').textContent = '';
    map.flyTo(gameToMap(parts[0], parts[1]), 2);
  });
});
</script>
</body>
</html>
