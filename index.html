<div class="login-screen">

    <p class="muted">Восстановите канал связи, введя учётные данные пары.</p>

      <label for="login">Логин</label>

<script>
document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('password').value;
  if (login.toLowerCase() === CONFIG.login.name.toLowerCase() && password === CONFIG.login.password) {
    markDone('q0');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('error').textContent = 'Доступ не подтверждён';
  }
});

  document.getElementById('error').textContent = '';
