<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — видеонаблюдение</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .cam-thumb { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
  .cam-thumb:hover img, .cam-thumb:focus-visible img { outline: 1px solid var(--accent); }
  .cam-modal { max-width: 960px; }
  .cam-view img, .cam-view video { width: 100%; display: block; background: #000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>СИСТЕМА ВИДЕОНАБЛЮДЕНИЯ</h1>
  <div class="panel">
    <p>Камеры станции и прилегающих секторов. Прямой эфир с задержкой.</p>
    <p class="muted">Нажмите на изображение камеры, чтобы развернуть её.</p>
  </div>
  <div class="panel">
    <div class="grid" id="cams"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q6');

const CAMERAS = [
  'ALPHA-CAM-01', 'BETA-CAM-02', 'BETA-CAM-03', 'GAMMA-CAM-04', 'GAMMA-CAM-05',
  'DELTA-CAM-06', 'EPSILON-CAM-07', 'ZETA-CAM-08', 'ETA-CAM-09', 'THETA-CAM-10'
];

const SPEAKER_LINE = 'Если кто-то слышит меня... найдите мой дневник. Существует еще одна таблица notes, все записи хранятся под ID персонала';

// Через сколько после разворачивания камеры появляется кнопка «Громкоговоритель».
const SPEAKER_DELAY_MS = 30000;
// Надпись над изображением: до появления кнопки и в момент её появления.
const NOTICE_WAIT = 'В случае фиксации движения, появится возможность Громкоговорителя';
const NOTICE_MOTION = 'Обнаружено движение. Включена возможность голосовой связи.';

let camBackdrop = null;
let speakerTimer = null;
let camKeyHandler = null;

function closeCamera() {
  clearTimeout(speakerTimer);
  speakerTimer = null;
  if (camKeyHandler) { document.removeEventListener('keydown', camKeyHandler); camKeyHandler = null; }
  if (camBackdrop) {
    camBackdrop.querySelectorAll('video, audio').forEach(m => { try { m.pause(); } catch (e) { /* без звука */ } });
    camBackdrop.remove();
    camBackdrop = null;
  }
}

function runSpeaker(cam, out) {
  // Файл реплики каждой камеры: audio/speaker_<имя_камеры_строчными, дефисы → _>.wav
  const audioFile = 'audio/speaker_' + cam.toLowerCase().replace(/-/g, '_') + '.wav';
  if (cam !== CONFIG.cameraId) {
    out.innerHTML = `
      <h2>${cam} — ГРОМКОГОВОРИТЕЛЬ ЛОКАЦИИ</h2>
      <p class="muted">Нет ответа с этой локации.</p>
      <audio id="speaker-audio" controls src="${audioFile}"></audio>`;
  } else {
    markDone('q7');
    out.innerHTML = `
      <h2>${CONFIG.cameraId} — ГРОМКОГОВОРИТЕЛЬ ЛОКАЦИИ</h2>
      <p>«${SPEAKER_LINE}»</p>
      <audio id="speaker-audio" controls src="${audioFile}"></audio>
      <p class="status-bad">Связь прервана. Сигнал потерян.</p>
      <a class="btn" href="dashboard.html">Личный кабинет</a>`;
  }
  const audio = out.querySelector('#speaker-audio');
  if (audio) audio.play().catch(() => {});
}

// Камера разворачивается в окне. Видео (только у камеры из CONFIG.cameraId) начинает играть
// с этого момента, остальные камеры показывают неподвижный кадр. Кнопка «Громкоговоритель»
// появляется через SPEAKER_DELAY_MS после разворачивания.
function openCamera(cam) {
  closeCamera();
  const n = cam.slice(-2);
  const still = `img/camera_${n}_empty.jpg`;
  const view = cam === CONFIG.cameraId
    ? `<video src="img/camera_${n}.mp4" poster="${still}" aria-label="${cam}"
             autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>`
    : `<img src="${still}" alt="${cam}">`;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal cam-modal" role="dialog" aria-modal="true" aria-label="${cam}">
      <h3>${cam}</h3>
      <p data-role="notice" class="muted">${NOTICE_WAIT}</p>
      <div class="cam-view">${view}</div>
      <p data-role="speaker-btn" style="display:none"><button type="button">Громкоговоритель</button></p>
      <div data-role="speaker-out"></div>
      <div class="modal-actions"><button type="button" data-role="close">Закрыть</button></div>
    </div>`;
  document.body.appendChild(backdrop);
  camBackdrop = backdrop;

  const video = backdrop.querySelector('video');
  if (video) {
    video.muted = true; // autoplay разрешён только для видео без звука
    video.addEventListener('error', () => {
      const img = document.createElement('img');
      img.src = still;
      img.alt = cam;
      video.replaceWith(img);
    });
    const started = video.play();
    if (started && started.catch) started.catch(() => {}); // если автозапуск запрещён, остаётся кадр-постер
  }

  const btnBox = backdrop.querySelector('[data-role="speaker-btn"]');
  const out = backdrop.querySelector('[data-role="speaker-out"]');
  btnBox.querySelector('button').addEventListener('click', () => runSpeaker(cam, out));
  const notice = backdrop.querySelector('[data-role="notice"]');
  speakerTimer = setTimeout(() => {
    btnBox.style.display = '';
    notice.textContent = NOTICE_MOTION;
    notice.className = 'status-bad';
  }, SPEAKER_DELAY_MS);

  backdrop.addEventListener('click', e => {
    if (e.target === backdrop || e.target.closest('[data-role="close"]')) closeCamera();
  });
  camKeyHandler = e => { if (e.key === 'Escape') closeCamera(); };
  document.addEventListener('keydown', camKeyHandler);
}

document.addEventListener('DOMContentLoaded', function () {
  // До нажатия все камеры показывают неподвижный кадр camera_NN_empty.jpg (запись «заморожена»).
  document.getElementById('cams').innerHTML = CAMERAS.map(c => {
    const n = c.slice(-2);
    return `<div class="tile" style="cursor:default">
        <button type="button" class="cam-thumb" data-open="${c}" aria-label="Развернуть ${c}">
          <img src="img/camera_${n}_empty.jpg" alt="${c}">
        </button>
        ${c}
      </div>`;
  }).join('');

  document.getElementById('cams').addEventListener('click', e => {
    const btn = e.target.closest('[data-open]');
    if (btn) openCamera(btn.dataset.open);
  });
});
</script>
</body>
</html>
