<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — анализ метаданных</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>АНАЛИЗ МЕТАДАННЫХ</h1>
  <div class="panel">
    <p>Загрузите файл с диска — инструмент выведет сырые теги без интерпретации.</p>
    <p id="filename" class="muted">Файл не выбран.</p>
    <p><input type="file" id="upload" accept="image/*"></p>
  </div>
  <div class="panel">
    <img id="preview" alt="" style="max-width:280px;display:none">
    <div id="tags"></div>
  </div>
  <div class="panel">
    <a class="btn" href="photos.html">Фотоархив</a>
    <a class="btn" href="dashboard.html">Личный кабинет</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q1');

const OPTIONS = { tiff: true, ifd0: true, exif: true, gps: true, translateValues: false, reviveValues: false, mergeOutput: true };

function formatValue(key, value) {
  if (Array.isArray(value) && value.length === 3 && /^GPS(Dest)?(Latitude|Longitude)$/.test(key)) {
    const [d, m, s] = value.map(Number);
    return `${d}° ${String(m).padStart(2, '0')}' ${s.toFixed(2)}"`;
  }
  if (Array.isArray(value)) return value.join(', ');
  if (value instanceof Uint8Array) return '[binary]';
  if (value && typeof value === 'object') return JSON.stringify(value);
  return String(value);
}

// Координата съёмки в десятичных градусах: из градусов-минут-секунд (+ полушарие) или готового числа.
function toDecimal(dms, ref, fallback) {
  if (Array.isArray(dms) && dms.length === 3) {
    const [d, m, s] = dms.map(Number);
    const sign = /^[SW]/i.test(String(ref || '')) ? -1 : 1;
    return sign * (d + m / 60 + s / 3600);
  }
  return typeof fallback === 'number' ? fallback : null;
}

// Квест 2 засчитывается по содержимому файла: координаты съёмки совпадают с целевыми.
// Имя файла не важно (повторная загрузка, "(1)", переименование телефоном).
// GPSDest-теги не учитываются — это ложный след.
function matchesTargetCoords(data) {
  if (!data) return false;
  const lat = toDecimal(data.GPSLatitude, data.GPSLatitudeRef, data.latitude);
  const lng = toDecimal(data.GPSLongitude, data.GPSLongitudeRef, data.longitude);
  if (lat === null || lng === null) return false;
  const tolerance = 0.0005;
  return Math.abs(lat - CONFIG.coords.lat) < tolerance && Math.abs(lng - CONFIG.coords.lng) < tolerance;
}

async function showTags(source, label) {
  document.getElementById('filename').textContent = 'Файл: ' + label;
  const tagsEl = document.getElementById('tags');
  tagsEl.innerHTML = '<p class="muted">Чтение метаданных…</p>';
  let data = null;
  try {
    data = await exifr.parse(source, OPTIONS);
  } catch (e) {
    tagsEl.innerHTML = `<p class="status-bad">Не удалось прочитать файл: ${e.message}</p>`;
    return null;
  }
  if (!data) {
    tagsEl.innerHTML = '<p class="status-bad">Метаданные не найдены в этом файле.</p>';
    return null;
  }
  const rows = Object.keys(data).sort().map(k =>
    `<tr><td>${k}</td><td>${formatValue(k, data[k])}</td></tr>`
  ).join('');
  tagsEl.innerHTML = `<table><tr><th>Тег</th><th>Значение</th></tr>${rows}</table>`;
  return data;
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('upload').addEventListener('change', function (e) {
    const f = e.target.files[0];
    if (!f) return;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(f);
    preview.style.display = '';
    showTags(f, f.name).then(data => {
      if (matchesTargetCoords(data)) {
        markDone('q2a');
        markDone('q2');
      }
    });
  });
});
</script>
</body>
</html>
