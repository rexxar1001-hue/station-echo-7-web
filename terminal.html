<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — Python-терминал</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>PYTHON-ТЕРМИНАЛ СТАНЦИИ</h1>
  <div class="panel" id="clipboardPanel" style="display:none">
    <p>Буфер терминала:</p>
    <pre id="clipboard"></pre>
  </div>
  <div class="panel">
    <label for="userInput">Python 3.11 — введите код:</label>
    <textarea id="userInput" rows="10" spellcheck="false" placeholder="&gt;&gt;&gt;"></textarea>
    <p><button id="run" type="button">Выполнить</button></p>
    <pre id="out">&gt;</pre>
    <div id="next"></div>
  </div>
  <div class="panel">
    <a class="btn" href="dashboard.html">Личный кабинет</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q5');

const params = new URLSearchParams(location.search);
const target = params.get('target');
let pyodideReady = null;

function afterDecode(decoded) {
  const next = document.getElementById('next');
  if (target === 'logs' && decoded.includes(CONFIG.cameraId)) {
    markDone('q6');
    next.innerHTML = '<p><a class="btn" href="cameras.html">Перейти к видеонаблюдению</a></p>';
  } else if (target === 'notes' && /[\w.\-]+\.html?/i.test(decoded)) {
    markDone('q8');
    const path = decoded.match(/[\w.\-]+\.html?/i)[0];
    next.innerHTML = `<p><a class="btn" href="${path}">${path}</a></p>`;
  } else {
    next.innerHTML = '';
  }
}

async function runCode() {
  const out = document.getElementById('out');
  const source = document.getElementById('userInput').value;
  if (!source.trim()) return;
  out.textContent = 'Инициализация интерпретатора…';
  pyodideReady = pyodideReady || loadPyodide().then(async py => {
    // input() в браузере не имеет stdin — спрашиваем значение через окно браузера.
    await py.runPythonAsync(`
import builtins, js

def _browser_input(prompt=''):
    answer = js.window.prompt(str(prompt))
    answer = '' if answer is None else str(answer)
    print(str(prompt) + answer)
    return answer

builtins.input = _browser_input
`);
    return py;
  });
  const pyodide = await pyodideReady;
  let printed = '';
  pyodide.setStdout({ batched: s => { printed += s + '\n'; } });
  pyodide.setStderr({ batched: s => { printed += s + '\n'; } });
  try {
    const result = await pyodide.runPythonAsync(source);
    if (result !== undefined && result !== null && !printed) printed = String(result) + '\n';
    out.textContent = printed.trim() || '(пустой вывод)';
    afterDecode(printed);
  } catch (e) {
    out.textContent = (printed + (e.message || e)).toString().split('\n').slice(-4).join('\n');
  }
}

document.addEventListener('DOMContentLoaded', function () {
  const value = params.get('value');
  if (value) {
    document.getElementById('clipboard').textContent = value;
    document.getElementById('clipboardPanel').style.display = '';
  }
  document.getElementById('run').addEventListener('click', runCode);
});
</script>
</body>
</html>
