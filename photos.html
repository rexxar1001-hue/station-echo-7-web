<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — фотоархив</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .lightbox { position: fixed; inset: 0; background: rgba(2, 6, 8, .92); display: none; z-index: 50;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: min(1100px, 92vw); max-height: 74vh; border: 1px solid var(--border); }
  .lightbox .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .lightbox .name { color: var(--fg-dim); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>АРХИВЫ — ФОТОАРХИВ</h1>
  <div class="panel">
    <p>Полевые снимки, загруженные персоналом станции. Имя файла содержит табельный номер сотрудника.</p>
  </div>
  <div class="panel">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lb-img" alt="">
  <div class="bar">
    <span class="name" id="lb-name"></span>
    <a class="btn" id="lb-download" download>Скачать снимок</a>
    <button class="btn" type="button" id="lb-close">Закрыть</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q1');

const PHOTO_IDS = [
  '012', '031', '044', '087', '019', '103', '066', '128', '075', '008',
  '140', '052', '097', '023', '111', '038', '084', '149', '061', '005'
];

document.addEventListener('DOMContentLoaded', function () {
  const grid = document.getElementById('grid');
  grid.innerHTML = PHOTO_IDS.map(id => {
    const file = `field_photo_${id}.jpg`;
    return `<div class="tile" data-file="${file}">
        <img src="img/${file}" alt="${file}" loading="lazy">${file}
      </div>`;
  }).join('');

  const box = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  const name = document.getElementById('lb-name');
  const download = document.getElementById('lb-download');

  function openBox(file) {
    img.src = 'img/' + file;
    img.alt = file;
    name.textContent = file;
    download.href = 'img/' + file;
    download.setAttribute('download', file);
    box.classList.add('open');
  }

  function closeBox() {
    box.classList.remove('open');
    img.src = '';
  }

  grid.addEventListener('click', e => {
    const tile = e.target.closest('[data-file]');
    if (tile) openBox(tile.dataset.file);
  });
  document.getElementById('lb-close').addEventListener('click', closeBox);
  box.addEventListener('click', e => { if (e.target === box) closeBox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox(); });
});
</script>
</body>
</html>
