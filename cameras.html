<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO-7 — видеонаблюдение</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>СИСТЕМА ВИДЕОНАБЛЮДЕНИЯ</h1>
  <div class="panel">
    <p>Камеры станции и прилегающих секторов. Прямой эфир с задержкой.</p>
  </div>
  <div class="panel">
    <div class="grid" id="cams"></div>
  </div>
  <div class="panel" id="speaker-out"></div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/notifications.js"></script>
<script src="js/menu.js"></script>
<script>
requireDone('q6');

const CAMERAS = [
  'ALPHA-CAM-01', 'BETA-CAM-02', 'BETA-CAM-03', 'GAMMA-CAM-04', 'GAMMA-CAM-05',
  'DELTA-CAM-06', 'EPSILON-CAM-07', 'ZETA-CAM-08', 'ETA-CAM-09', 'THETA-CAM-10'
];

const SPEAKER_LINE = 'Если кто-то слышит меня... найдите мой дневник. Существует еще одна таблица notes, все записи хранятся под ID персонала';

document.addEventListener('DOMContentLoaded', function () {
  // Все камеры — статичные кадры; камера из CONFIG.cameraId показывает зацикленное MP4 без
  // элементов управления (выглядит как анимированная картинка). Пока файла camera_NN.mp4 нет
  // (или браузер не может его проиграть), показывается обычный кадр camera_NN_empty.jpg.
  document.getElementById('cams').innerHTML = CAMERAS.map(c => {
    const n = c.slice(-2);
    const still = `img/camera_${n}_empty.jpg`;
    const view = c === CONFIG.cameraId
      ? `<video src="img/camera_${n}.mp4" poster="${still}" data-cam="${c}" aria-label="${c}"
               autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>`
      : `<img src="${still}" alt="${c}" data-cam="${c}">`;
    return `<div class="tile" style="cursor:default">
        ${view}
        ${c}
        <p><button type="button" data-speaker="${c}">Громкоговоритель</button></p>
      </div>`;
  }).join('');

  document.querySelectorAll('#cams video').forEach(v => {
    v.muted = true; // autoplay разрешён только для видео без звука
    v.addEventListener('error', () => {
      const img = document.createElement('img');
      img.src = v.getAttribute('poster');
      img.alt = v.getAttribute('aria-label') || '';
      img.dataset.cam = v.dataset.cam;
      v.replaceWith(img);
    });
    const started = v.play();
    if (started && started.catch) started.catch(() => {}); // если автозапуск запрещён, остаётся кадр-постер
  });

  document.getElementById('cams').addEventListener('click', e => {
    const btn = e.target.closest('[data-speaker]');
    if (!btn) return;
    const out = document.getElementById('speaker-out');
    // Файл реплики каждой камеры: audio/speaker_<имя_камеры_строчными, дефисы → _>.wav
    const cam = btn.dataset.speaker;
    const audioFile = 'audio/speaker_' + cam.toLowerCase().replace(/-/g, '_') + '.wav';
    if (cam !== CONFIG.cameraId) {
      out.innerHTML = `
        <h2>${cam} — ГРОМКОГОВОРИТЕЛЬ ЛОКАЦИИ</h2>
        <p class="muted">Нет ответа с этой локации.</p>
        <audio id="speaker-audio" controls src="${audioFile}"></audio>`;
      const other = document.getElementById('speaker-audio');
      if (other) other.play().catch(() => {});
      return;
    }
    markDone('q7');
    out.innerHTML = `
      <h2>${CONFIG.cameraId} — ГРОМКОГОВОРИТЕЛЬ ЛОКАЦИИ</h2>
      <p>«${SPEAKER_LINE}»</p>
      <audio id="speaker-audio" controls src="${audioFile}"></audio>
      <p class="status-bad">Связь прервана. Сигнал потерян.</p>
      <a class="btn" href="dashboard.html">Личный кабинет</a>`;
    const audio = document.getElementById('speaker-audio');
    if (audio) audio.play().catch(() => {});
  });
});
</script>
</body>
</html>
